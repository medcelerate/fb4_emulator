[package]
name = "fb4_bridge"
version = "0.1.0"
edition = "2021"
description = "Emulate FB4 laser controllers toward QuickShow/BEYOND and forward the decoded stream to Ether Dream DACs."

[[bin]]
name = "fb4_bridge"
path = "src/main.rs"

[dependencies]
# Reuse the FB4 protocol codec (key derivation, DES-CBC decrypt, point-stream parse).
# Pulled from the fb4_rs library repo so CI and fresh clones build without a local checkout.
fb4 = { git = "https://github.com/medcelerate/FB4" }
# Ether Dream DAC discovery + streaming.
ether-dream = "0.2"

# For local development against a sibling checkout of the library, uncomment:
# [patch."https://github.com/medcelerate/FB4"]
# fb4 = { path = "../fb4_rust" }

[profile.release]
opt-level = 3
