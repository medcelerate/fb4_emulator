name: build-emulator

# Builds the Windows FB4 emulator (fb4_bridge). The fb4 library is vendored under fb4_rust/, so
# this is fully self-contained: a single checkout + cargo build, no auth or external dependencies
# beyond crates.io.
#
# Assumes this repo's root is the fb4_bridge crate (Cargo.toml at the root). If the crate lives in
# a subdirectory, add `working-directory:` to the cargo/package steps.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Build fb4_bridge (Windows x64)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/fb4_bridge.exe dist/
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath fb4_bridge-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fb4_bridge-windows-x64
          path: fb4_bridge-windows-x64.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: fb4_bridge-windows-x64.zip
