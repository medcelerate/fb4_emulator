[package]
name = "fb4_bridge"
version = "0.1.0"
edition = "2021"
description = "Emulate FB4 laser controllers toward QuickShow/BEYOND and forward the decoded stream to Ether Dream DACs."

[[bin]]
name = "fb4_bridge"
path = "src/main.rs"

[dependencies]
# FB4 protocol codec (key derivation, DES-CBC decrypt, point-stream parse). Vendored into this
# repo under fb4_rust/ so the build is fully self-contained — no git auth, no external checkout.
fb4 = { path = "fb4_rust" }
# Ether Dream DAC discovery + streaming.
ether-dream = "0.2"
# Custom broadcast-discovery socket (SO_REUSEADDR so we coexist with other listeners).
socket2 = "0.5"
# List local network interfaces for startup diagnostics.
if-addrs = "0.10"

[profile.release]
opt-level = 3
